<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 회화 동화로 표현하기 프로젝트(수행평가)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f3f4f6; }
        .japanese-font { font-family: 'Zen Maru Gothic', sans-serif; }
        .flip-card { perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ 구글 앱스 스크립트 웹 앱 URL 입력
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx8tQkPlLMm1_j95Yy_ig5_-YGpBQb13heM72OV598mAVgVOUKHOfWQI70p68u6_Y0oKw/exec";

        // 🏫 드롭다운에 표시될 반 목록 (필요시 수정 가능)
        const CLASS_OPTIONS = ['a8반', 'B7반', 'C6반', 'E1반';

        // ==========================================
        // 📚 학습 데이터
        // ==========================================
        const wordsData = [
            { ko: "만들다", jp: "つくる [츠쿠루]" },
            { ko: "무엇, 뭐", jp: "なに [나니]" },
            { ko: "~(으)로 (수단, 재료)", jp: "で [데]" },
            { ko: "~은, 는", jp: "は [와]" },
            { ko: "~이, 가", jp: "が [가]" },
            { ko: "흙", jp: "つち [츠치]" },
            { ko: "뱀", jp: "へび [헤비]" },
            { ko: "항아리", jp: "つぼ [츠보]" },
            { ko: "술", jp: "さけ [사케]" },
            { ko: "친구", jp: "ともだち [토모다치]" },
            { ko: "염소", jp: "やぎ [야기]" },
            { ko: "가죽", jp: "かわ(革) [카와]" },
            { ko: "북", jp: "たいこ [타이코]" },
            { ko: "리듬", jp: "リズム [리즈무]" },
            { ko: "축제", jp: "まつり [마츠리]" },
            { ko: "솜", jp: "わた [와타]" },
            { ko: "실", jp: "いと [이토]" },
            { ko: "천", jp: "ぬの [누노]" },
            { ko: "옷", jp: "きもの [키모노]" },
            { ko: "허수아비", jp: "かかし [카카시]" },
            { ko: "돌", jp: "いし [이시]" },
            { ko: "철", jp: "てつ [테츠]" },
            { ko: "가위", jp: "はさみ [하사미]" },
            { ko: "오린 것", jp: "きりぬき [키리누키]" },
            { ko: "그림책", jp: "えほん [에홍]" },
            { ko: "물", jp: "みず [みず]" },
            { ko: "강", jp: "かわ(川) [카와]" },
            { ko: "댐", jp: "ダム [다무]" },
            { ko: "전기", jp: "でんき [뎅키]" },
            { ko: "빛, 등불", jp: "あかり [아카리]" },
            { ko: "해님", jp: "おひさま [오히사마]" },
            { ko: "채소", jp: "やさい [야사이]" },
            { ko: "샐러드", jp: "サラダ [사라다]" },
            { ko: "몸", jp: "からだ [카라다]" },
            { ko: "기록", jp: "きろく [키로쿠]" },
            { ko: "성냥", jp: "マッチ [맛치]" },
            { ko: "불", jp: "ひ [히]" },
            { ko: "모닥불", jp: "たきび [타키비]" },
            { ko: "군고구마", jp: "やきいも [야키이모]" },
            { ko: "방귀", jp: "おなら [오나라]" },
            { ko: "나무", jp: "き [키]" },
            { ko: "통나무", jp: "まるた [마루타]" },
            { ko: "다리", jp: "はし [하시]" },
            { ko: "길", jp: "みち [미치]" },
            { ko: "마을, 동네", jp: "まち [마치]" },
            { ko: "닭", jp: "にわとり [니와토리]" },
            { ko: "달걀", jp: "たまご [타마고]" },
            { ko: "닭꼬치", jp: "やきとり [야키토리]" },
            { ko: "돈", jp: "おかね [오카네]" },
            { ko: "사람", jp: "ひと [히토]" },
            { ko: "병사", jp: "へいたい [헤이타이]" },
            { ko: "군대", jp: "ぐんたい [군타이]" },
            { ko: "전쟁", jp: "せんそう [센소-]" }
        ];

        const standardSentences = [
            { ko: "흙으로 무엇을 만들어? / 항아리 만들어.", jp: "つちで なに つくる？ [츠치데 나니 츠쿠루?] / つぼ つくる。 [츠보 츠쿠루.]" },
            { ko: "종이로 무엇을 만들어? / 종이학 만들어.", jp: "かみで なに つくる？ [카미데 나니 츠쿠루?] / おりづる つくる。 [오리즈루 츠쿠루.]" },
            { ko: "나무로 무엇을 만들어? / 의자 만들어.", jp: "きで なに つくる？ [키데 나니 츠쿠루?] / いす つくる。 [이스 츠쿠루.]" },
            { ko: "천으로 무엇을 만들어? / 옷 만들어.", jp: "ぬので なに つくる？ [누노데 나니 츠쿠루?] / ふく つくる。 [후쿠 츠쿠루.]" },
            { ko: "눈으로 무엇을 만들어? / 눈사람 만들어.", jp: "ゆきで なに つくる？ [유키데 나니 츠쿠루?] / ゆきだるま つくる。 [유키だるま 츠쿠루.]" },
            { ko: "모래로 무엇을 만들어? / 모래성 만들어.", jp: "すなで なに つくる？ [스나데 나니 츠쿠루?] / すなのおしろ つくる。 [스나노오시로 츠쿠루.]" },
            { ko: "밀가루로 무엇을 만들어? / 빵 만들어.", jp: "こむぎこで なに つくる？ [코무기코데 나니 츠쿠루?] / パン つくる。 [팡 츠쿠루.]" },
            { ko: "흙으로 뱀 만들어.", jp: "つちで へび つくる。 [츠치데 헤비 츠쿠루.]" }
        ];

        // ==========================================
        // 🏠 메인 홈 화면
        // ==========================================
        function HomeScreen({ setScreen, refreshData, isLoading }) {
            return (
                <div className="flex flex-col items-center justify-center py-10 animate-fade-in px-4">
                    <div className="w-28 h-28 bg-indigo-100 rounded-full flex items-center justify-center mb-8 shadow-sm">
                        <i className="fa-solid fa-book-open text-6xl text-indigo-500"></i>
                    </div>
                    <h1 className="text-4xl font-black text-gray-800 mb-4 text-center">일본어 회화 동화로 표현하기</h1>
                    <p className="text-gray-500 mb-8 font-medium text-lg">수행평가 연습 및 채점 시스템</p>
                    
                    {isLoading && (
                        <div className="mb-6 bg-amber-50 text-amber-700 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                            <i className="fa-solid fa-spinner animate-spin"></i> 데이터를 동기화 중입니다...
                        </div>
                    )}

                    <div className="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onClick={() => setScreen('practice')} className="py-5 px-4 text-lg font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-all">
                            <i className="fa-solid fa-headphones mr-3"></i> 단어 및 문장 연습
                        </button>
                        <button onClick={() => setScreen('student-submit')} className="py-5 px-4 text-lg font-bold rounded-xl text-indigo-700 bg-indigo-100 hover:bg-indigo-200 shadow-sm transition-all">
                            <i className="fa-solid fa-pen mr-3"></i> 동화책 제출하기
                        </button>
                        <button onClick={() => { refreshData(); setScreen('student-result'); }} className="py-5 px-4 text-lg font-bold rounded-xl text-indigo-600 border border-indigo-200 bg-white hover:bg-gray-50 shadow-sm transition-all md:col-span-2">
                            <i className="fa-solid fa-chart-bar mr-3"></i> 내 평가 결과 확인
                        </button>
                        
                        <div className="md:col-span-2 border-t border-gray-200 my-2"></div>
                        
                        <button onClick={() => { refreshData(); setScreen('teacher-login'); }} className="py-5 px-4 text-lg font-bold rounded-xl text-white bg-gray-800 hover:bg-gray-900 shadow-md transition-all md:col-span-2">
                            <i className="fa-solid fa-chalkboard-user mr-3"></i> 교사 채점 모드
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 🎧 연습 화면
        // ==========================================
        function PracticeScreen({ setScreen }) {
            const [mode, setMode] = useState('words');
            const [flippedState, setFlippedState] = useState({});

            const toggleFlip = (idx) => {
                setFlippedState({ ...flippedState, [idx]: !flippedState[idx] });
            };

            const getList = () => mode === 'words' ? wordsData : standardSentences;

            return (
                <div className="flex flex-col h-[80vh]">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => setScreen('home')} className="text-gray-500 hover:text-gray-800 text-xl font-bold"><i className="fa-solid fa-arrow-left"></i> 뒤로</button>
                        <h2 className="text-xl font-bold text-gray-800">연습 모드</h2>
                        <div></div>
                    </div>

                    <div className="flex bg-gray-200 rounded-lg p-1 mb-6">
                        <button onClick={() => setMode('words')} className={`flex-1 py-2 text-sm font-bold rounded-md transition ${mode === 'words' ? 'bg-white shadow text-indigo-600' : 'text-gray-500'}`}>단어 연습</button>
                        <button onClick={() => setMode('sentences')} className={`flex-1 py-2 text-sm font-bold rounded-md transition ${mode === 'sentences' ? 'bg-white shadow text-indigo-600' : 'text-gray-500'}`}>그림책 문장</button>
                    </div>

                    <div className="flex-1 overflow-y-auto pb-10">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                            {getList().map((item, idx) => (
                                <div key={idx} className={`flip-card h-48 ${flippedState[idx] ? 'flipped' : ''}`} onClick={() => toggleFlip(idx)}>
                                    <div className="flip-card-inner shadow-md rounded-xl border border-gray-200">
                                        <div className="flip-card-front absolute w-full h-full bg-white rounded-xl flex flex-col items-center justify-center p-4">
                                            <p className="font-bold text-gray-800 text-center">{item.ko}</p>
                                            <span className="absolute bottom-3 text-xs text-gray-400"><i className="fa-solid fa-hand-pointer"></i> 클릭하여 정답 확인</span>
                                        </div>
                                        <div className="flip-card-back absolute w-full h-full bg-indigo-50 rounded-xl flex flex-col items-center justify-center p-4">
                                            <p className="font-bold text-indigo-700 text-center japanese-font text-lg">{item.jp}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ✍️ 학생 제출 화면 (반 선택 드롭다운 정제)
        // ==========================================
        function StudentSubmitScreen({ setScreen, refreshData }) {
            const [studentClass, setStudentClass] = useState('');
            const [studentId, setStudentId] = useState('');
            const [studentName, setStudentName] = useState('');
            const [sentences, setSentences] = useState([{ ko: '' }, { ko: '' }, { ko: '' }, { ko: '' }]);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSentenceChange = (index, value) => {
                const newSentences = [...sentences];
                newSentences[index].ko = value;
                setSentences(newSentences);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!studentClass) {
                    return alert("반을 선택해주세요.");
                }
                if (!studentId.trim() || !studentName.trim()) {
                    return alert("학번과 이름을 모두 입력해주세요.");
                }
                for (let s of sentences) {
                    if (!s.ko.trim()) return alert("4문장을 모두 입력해주세요.");
                }

                setIsSubmitting(true);
                const payload = {
                    action: 'submitStory',
                    data: { 
                        studentClass: studentClass.trim(), 
                        studentId: studentId.trim(), 
                        studentName: studentName.trim(), 
                        sentences 
                    }
                };

                try {
                    if (GAS_URL.includes("YOUR_GOOGLE")) {
                        alert("구글 앱스 스크립트 URL(GAS_URL)이 설정되어 있지 않습니다.");
                    } else {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert("선생님께 정상적으로 제출되었습니다!");
                    }
                    refreshData();
                    setScreen('home');
                } catch (err) {
                    alert("제출 중 오류가 발생했습니다: " + err.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="flex flex-col py-4 max-w-xl mx-auto w-full">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">나의 동화책 제출하기</h2>
                    <form onSubmit={handleSubmit} className="flex flex-col gap-6">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">일본어 반</label>
                                <select 
                                    value={studentClass} 
                                    onChange={(e) => setStudentClass(e.target.value)}
                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-bold"
                                >
                                    <option value="">반 선택</option>
                                    {CLASS_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">학번</label>
                                <input 
                                    type="text" 
                                    placeholder="예: 10101" 
                                    value={studentId} 
                                    onChange={e => setStudentId(e.target.value)} 
                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">이름</label>
                                <input 
                                    type="text" 
                                    placeholder="예: 홍길동" 
                                    value={studentName} 
                                    onChange={e => setStudentName(e.target.value)} 
                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold" 
                                />
                            </div>
                        </div>

                        <div className="flex flex-col gap-3">
                            <p className="text-sm font-bold text-gray-600"><i className="fa-solid fa-pen-nib mr-1"></i> 창작 동화책 문장 (한국어 4개)</p>
                            {sentences.map((s, idx) => (
                                <div key={idx} className="bg-indigo-50 p-3.5 rounded-xl border border-indigo-100">
                                    <span className="text-xs font-bold text-indigo-600 mb-1 block">{idx + 1}번째 문장 세트</span>
                                    <input 
                                        type="text" 
                                        placeholder="예: 평화는 무엇을 만들어? / 친구를 만들어." 
                                        value={s.ko} 
                                        onChange={(e) => handleSentenceChange(idx, e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none bg-white focus:ring-2 focus:ring-indigo-400"
                                    />
                                </div>
                            ))}
                        </div>

                        <div className="flex gap-3 mt-2">
                            <button type="button" onClick={() => setScreen('home')} className="flex-1 bg-gray-200 hover:bg-gray-300 py-3.5 rounded-xl font-bold text-gray-700 transition">취소</button>
                            <button type="submit" disabled={isSubmitting} className="flex-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow transition">
                                {isSubmitting ? '제출 중...' : '선생님께 제출하기'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 📊 학생 결과 확인 화면
        // ==========================================
        function StudentResultScreen({ setScreen, testScores }) {
            const [searchName, setSearchName] = useState('');
            const [result, setResult] = useState(null);
            const [searched, setSearched] = useState(false);

            const handleSearch = (e) => {
                e.preventDefault();
                setSearched(true);
                const query = searchName.trim();
                const foundKey = Object.keys(testScores).find(key => key.includes(query));
                setResult(foundKey ? { name: foundKey, ...testScores[foundKey] } : null);
            };

            return (
                <div className="flex flex-col py-6 max-w-md mx-auto w-full">
                    <button onClick={() => setScreen('home')} className="mb-4 text-gray-500 font-bold self-start"><i className="fa-solid fa-arrow-left"></i> 홈으로</button>
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">내 결과 확인</h2>

                    <form onSubmit={handleSearch} className="flex flex-col gap-3">
                        <input 
                            type="text" 
                            value={searchName} 
                            onChange={(e) => setSearchName(e.target.value)}
                            placeholder="이름 입력 (예: 홍길동)"
                            className="border-2 border-indigo-200 rounded-xl p-3 outline-none focus:border-indigo-500 font-bold text-center"
                        />
                        <button type="submit" className="bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">결과 조회</button>
                    </form>

                    {searched && (
                        <div className="mt-6 p-6 bg-white rounded-xl border text-center shadow-sm">
                            {result ? (
                                <>
                                    <p className="text-gray-600 font-bold">{result.name} 학생의 결과</p>
                                    <div className="text-5xl font-black text-indigo-600 my-4">{result.score} 점</div>
                                </>
                            ) : (
                                <p className="text-red-500 font-bold">해당 이름의 채점 결과가 없습니다.</p>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🔒 교사 모드 화면
        // ==========================================
        function TeacherLoginScreen({ setScreen }) {
            const [password, setPassword] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                if (password === '1207') setScreen('test-setup');
                else alert('비밀번호가 일치하지 않습니다.');
            };

            return (
                <div className="flex flex-col items-center justify-center py-10">
                    <h2 className="text-2xl font-black mb-6">교사 채점 모드</h2>
                    <form onSubmit={handleLogin} className="w-full max-w-xs flex flex-col gap-4">
                        <input 
                            type="password" 
                            placeholder="비밀번호" 
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            className="p-3 border rounded-xl text-center text-lg font-bold"
                        />
                        <button type="submit" className="bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-900 transition">로그인</button>
                    </form>
                </div>
            );
        }

        function TestSetupScreen({ setScreen, setSelectedStudent, setTestQuestions, studentData }) {
            const studentsList = Object.keys(studentData).map(key => ({
                name: key,
                sentences: studentData[key]
            }));

            const startTest = (student) => {
                setSelectedStudent(student.name);
                const storyQ = (student.sentences || []).map(s => ({ type: '창작', ko: s.ko, jp: '' }));
                const stdQ = standardSentences.slice(0, 4).map(q => ({ type: '기본', ko: q.ko, jp: q.jp }));
                setTestQuestions([...stdQ, ...storyQ]);
                setScreen('test-run');
            };

            return (
                <div className="max-w-xl mx-auto py-6">
                    <h2 className="text-2xl font-bold mb-6">평가 대상 학생 선택</h2>
                    <div className="bg-white rounded-xl border divide-y">
                        {studentsList.length > 0 ? studentsList.map((st, i) => (
                            <div key={i} className="p-4 flex justify-between items-center">
                                <span className="font-bold text-gray-800">{st.name}</span>
                                <button onClick={() => startTest(st)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold">평가 시작</button>
                            </div>
                        )) : (
                            <p className="p-8 text-center text-gray-400">제출된 학생 데이터가 없습니다.</p>
                        )}
                    </div>
                </div>
            );
        }

        function TestRunScreen({ setScreen, testQuestions, studentName, refreshData }) {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);

            const handleMark = (isCorrect) => {
                const nextScore = isCorrect ? score + 1 : score;
                setScore(nextScore);

                if (idx < testQuestions.length - 1) {
                    setIdx(idx + 1);
                } else {
                    const payload = {
                        action: 'saveScore',
                        data: { studentName, score: nextScore, details: testQuestions }
                    };
                    
                    if (!GAS_URL.includes("YOUR_GOOGLE")) {
                        fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }
                    alert(`채점 완료! 최종 점수: ${nextScore}점`);
                    refreshData();
                    setScreen('home');
                }
            };

            const current = testQuestions[idx];

            return (
                <div className="max-w-xl mx-auto py-6 text-center">
                    <h3 className="text-xl font-bold mb-4">{studentName} ({idx + 1} / {testQuestions.length})</h3>
                    <div className="bg-white p-8 rounded-2xl border-2 mb-6 shadow-sm">
                        <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2.5 py-1 rounded-md">{current.type}</span>
                        <p className="text-2xl font-bold my-6">{current.ko}</p>
                        {current.jp && <p className="text-indigo-600 font-bold text-lg">{current.jp}</p>}
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => handleMark(false)} className="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-6 rounded-2xl text-2xl">X (오답)</button>
                        <button onClick={() => handleMark(true)} className="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-6 rounded-2xl text-2xl">O (정답)</button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // App 컴포넌트
        // ==========================================
        function App() {
            const [screen, setScreen] = useState('home');
            const [studentData, setStudentData] = useState({});
            const [testScores, setTestScores] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState('');
            const [testQuestions, setTestQuestions] = useState([]);

            const refreshData = async () => {
                if (GAS_URL.includes("YOUR_GOOGLE")) return;
                setIsLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?action=getData`);
                    const data = await res.json();
                    if (data.studentData) setStudentData(data.studentData);
                    if (data.testScores) setTestScores(data.testScores);
                } catch (e) {
                    console.log("데이터 동기화 실패:", e);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                refreshData();
            }, []);

            const renderScreen = () => {
                switch(screen) {
                    case 'home': return <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />;
                    case 'practice': return <PracticeScreen setScreen={setScreen} />;
                    case 'student-submit': return <StudentSubmitScreen setScreen={setScreen} refreshData={refreshData} />;
                    case 'student-result': return <StudentResultScreen setScreen={setScreen} testScores={testScores} />;
                    case 'teacher-login': return <TeacherLoginScreen setScreen={setScreen} />;
                    case 'test-setup': return <TestSetupScreen setScreen={setScreen} setSelectedStudent={setSelectedStudent} setTestQuestions={setTestQuestions} studentData={studentData} />;
                    case 'test-run': return <TestRunScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} refreshData={refreshData} />;
                    default: return <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />;
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 py-6 px-4 flex justify-center">
                    <div className="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 min-h-[85vh] border">
                        {renderScreen()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
